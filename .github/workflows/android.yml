name: Build ALJESI APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files
        run: flutter create . --platforms=android
      - name: Locate Android SDK manager
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under: $SDK_ROOT/cmdline-tools"
            find "$SDK_ROOT" -maxdepth 5 -type f -name sdkmanager -print 2>/dev/null || true
            exit 1
          fi
          echo "Using Android SDK manager: $SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
      - name: Accept Android SDK licenses and install API 36
        shell: bash
        run: |
          # sdkmanager may close stdin after accepting all licenses. With
          # GitHub Actions' pipefail, the resulting SIGPIPE from `yes` can
          # incorrectly fail the step even when sdkmanager succeeded.
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          SDKMANAGER_STATUS=${PIPESTATUS[1]}
          set -o pipefail
          if [ "$SDKMANAGER_STATUS" -ne 0 ]; then
            echo "sdkmanager license acceptance failed with exit code $SDKMANAGER_STATUS"
            exit "$SDKMANAGER_STATUS"
          fi
          "$SDKMANAGER" "platforms;android-36"
      - name: Align all Android modules to compileSdk 36
        shell: bash
        run: |
          # Uses a Gradle init script so it works with both build.gradle and
          # build.gradle.kts (never edit/append android/build.gradle: new Flutter
          # templates use .kts, and adding a .gradle file next to it moves the
          # build output away from build/app/outputs/flutter-apk).
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/compile-sdk.gradle" <<'GRADLE'
          allprojects {
              // Lint is a quality check, not needed to produce the APK; it crashes
              // on some plugin sources, so skip all lint tasks.
              tasks.configureEach { t ->
                  if (t.name.startsWith("lint")) {
                      t.enabled = false
                  }
              }
              afterEvaluate { p ->
                  if (p.hasProperty("android")) {
                      p.android.compileSdkVersion 36
                  }
              }
          }
          GRADLE
          echo "Configured Android subprojects to compile against API 36"
      - name: Set app display name
        run: sed -i 's/android:label="aljesi_browser"/android:label="الجيسي"/' android/app/src/main/AndroidManifest.xml
      - name: Install packages
        run: flutter pub get
      - name: Fix legacy ProGuard setting in Android WebView plugin
        shell: bash
        run: |
          PLUGIN_GRADLE="$(find "$HOME/.pub-cache/hosted/pub.dev" -path '*/flutter_inappwebview_android-*/android/build.gradle' -print -quit)"
          if [ -z "$PLUGIN_GRADLE" ]; then
            echo "flutter_inappwebview_android Gradle file was not found (skipping)"
            exit 0
          fi
          sed -i 's/proguard-android\.txt/proguard-android-optimize.txt/g' "$PLUGIN_GRADLE"
          echo "Patched: $PLUGIN_GRADLE"
          grep -n 'getDefaultProguardFile' "$PLUGIN_GRADLE" || true
      - name: Generate launcher icon
        run: dart run flutter_launcher_icons
      - name: Build release APK
        run: flutter build apk --release
      - name: Collect APK
        shell: bash
        run: |
          mkdir -p out
          APK="$(find . -type f -name 'app-release.apk' -not -path './out/*' -print -quit)"
          if [ -z "$APK" ]; then
            echo "APK not found. Candidates:"; find . -name '*.apk' 2>/dev/null
            exit 1
          fi
          echo "Found: $APK"
          cp "$APK" out/aljesi-browser.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aljesi-browser-apk
          path: out/aljesi-browser.apk
