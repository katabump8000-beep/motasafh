name: Build ALJESI APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files
        run: flutter create . --platforms=android
      - name: Set app display name
        run: sed -i 's/android:label="aljesi_browser"/android:label="الجيسي"/' android/app/src/main/AndroidManifest.xml
      - name: Install packages
        run: flutter pub get
      - name: Generate launcher icon
        run: dart run flutter_launcher_icons
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aljesi-browser-apk
          path: build/app/outputs/flutter-apk/app-release.apk
